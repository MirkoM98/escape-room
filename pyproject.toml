[project]
name = "escape-room"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.116.0",
    "fastapi>=0.138.0",
    "psycopg[binary]>=3.2",
    "uvicorn[standard]>=0.30.0",
]

[tool.vercel]
entrypoint = "backend.main:app"

[tool.vercel.scripts]
build = "python build_frontend.py"
